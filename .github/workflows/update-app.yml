name: update-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - 'master'
  pull_request:
    paths:
      - '.github/workflows/update-app.yml'
      - 'build.properties'

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: update-app
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      -
        name: GitHub auth token from GitHub App
        id: write-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTAPPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PORTAPPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.write-app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update Postman
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &update-script |
            const fs = require('fs');
            const path = require('path');

            const feedUrl = 'https://dl.pstmn.io/changelog?channel=stable&platform=win';
            const response = await fetch(feedUrl);
            if (!response.ok) {
              throw new Error(`Postman changelog request failed: ${response.status}`);
            }
            const { changelog } = await response.json();
            if (!Array.isArray(changelog)) {
              throw new Error('Postman changelog has no releases');
            }

            function versionParts(version) {
              if (!/^\d+\.\d+\.\d+$/.test(version)) {
                throw new Error(`Invalid Postman version: ${version}`);
              }
              return version.split('.').map(Number);
            }

            function compareVersions(left, right) {
              const leftParts = versionParts(left);
              const rightParts = versionParts(right);
              for (let i = 0; i < 3; i++) {
                if (leftParts[i] !== rightParts[i]) {
                  return leftParts[i] - rightParts[i];
                }
              }
              return 0;
            }

            const stable = changelog.filter(release => {
              if (release.channel !== 'stable' || !/^\d+\.\d+\.\d+$/.test(release.name)) {
                return false;
              }
              const downloadUrl = `https://dl.pstmn.io/download/version/${release.name}/windows64`;
              return release.assets?.some(asset => asset.url === downloadUrl);
            });
            if (stable.length === 0) {
              throw new Error('No stable Postman Windows x64 release found');
            }
            stable.sort((left, right) => compareVersions(left.name, right.name));
            const latestVersion = stable.at(-1).name;

            const propertiesPath = path.join(process.env.GITHUB_WORKSPACE, 'build.properties');
            const original = fs.readFileSync(propertiesPath, 'utf8');
            const versionMatch = original.match(/^app\.version[ \t]*=[ \t]*(\S+)[ \t]*\r?$/m);
            const releaseMatch = original.match(/^app\.release[ \t]*=[ \t]*(\d+)[ \t]*\r?$/m);
            if (!versionMatch || !releaseMatch) {
              throw new Error('Missing or invalid app.version or app.release in build.properties');
            }

            const currentVersion = versionMatch[1];
            const nextRelease = Number(releaseMatch[1]) + 1;
            if (!Number.isSafeInteger(nextRelease)) {
              throw new Error(`Invalid app.release: ${releaseMatch[1]}`);
            }
            if (compareVersions(latestVersion, currentVersion) > 0) {
              const updated = original
                .replace(/^(app\.version[ \t]*=[ \t]*)\S+/m, (_, prefix) => `${prefix}${latestVersion}`)
                .replace(/^(app\.release[ \t]*=[ \t]*)\d+/m, (_, prefix) => `${prefix}${nextRelease}`);
              fs.writeFileSync(propertiesPath, updated, 'utf8');
              core.info(`Updated Postman from ${currentVersion} to ${latestVersion}`);
            } else {
              core.info(`Postman ${currentVersion} is already current or newer`);
            }
            core.setOutput('version', latestVersion);
      -
        name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: update-postman
          token: ${{ steps.write-app.outputs.token }}
          commit-message: Postman ${{ steps.update.outputs.version }}
          title: Postman ${{ steps.update.outputs.version }}
          signoff: true
          sign-commits: true
          delete-branch: true
          body: |
            This updates Postman to ${{ steps.update.outputs.version }}.

  diff:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update Postman
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *update-script
      -
        name: Show diff
        shell: pwsh
        run: |
          $diff = git --no-pager diff -- build.properties
          if ($diff) {
            $diff
          } else {
            Write-Host "No update diff."
          }
